name: Generar APK de Android
# Arma la app de Android con Capacitor y deja el APK en la página de
# descargas del repositorio (release "android"), siempre en el mismo enlace:
# https://github.com/<usuario>/<repo>/releases/download/android/que-no-se-caiga.apk
on:
  push:
    paths:
      - 'www/**'
      - '!www/cuentas/**'   # el portal de cuentas no va en la app del juego
      - 'assets/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'tools/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    concurrency:
      group: apk
      cancel-in-progress: true
    env:
      # Clave sólo para firmar esta app familiar (permite instalar actualizaciones encima).
      KEYSTORE: tools/android/que-no-se-caiga.keystore
      KEY_ALIAS: ahorcado
      KEY_PASS: ahorcado-familia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        run: npm install

      - name: Crear el proyecto de Android
        run: |
          npx cap add android
          npx --yes @capacitor/assets@3.0.5 generate --android \
            --iconBackgroundColor '#4fc3f7' --splashBackgroundColor '#fff8e7' --splashBackgroundColorDark '#fff8e7'
          npx cap sync android
          # Número de versión que sube con cada armado, para que Android acepte la actualización.
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Armar el APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Firmar el APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEY_PASS" --key-pass "pass:$KEY_PASS" --out que-no-se-caiga.apk aligned.apk
          "$BT/apksigner" verify --print-certs que-no-se-caiga.apk | head -3
          ls -la que-no-se-caiga.apk

      - name: Publicar en Descargas (release "android")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Versión 1.0.${{ github.run_number }}. Descarga que-no-se-caiga.apk desde el teléfono Android para instalar o actualizar el juego."
          if gh release view android >/dev/null 2>&1; then
            gh release edit android --title "App de Android" --notes "$NOTES"
          else
            gh release create android --title "App de Android" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload android que-no-se-caiga.apk --clobber
