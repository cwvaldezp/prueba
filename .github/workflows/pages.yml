name: Publicar en GitHub Pages
# Publica la carpeta www/ cada vez que cambia la rama principal del repositorio
# (sea cual sea su nombre). También se puede lanzar a mano desde la pestaña Actions.
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    # Va dentro del trabajo para que las ramas que no publican no cancelen la publicación.
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
