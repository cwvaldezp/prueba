<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4fc3f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ahorcado">
  <title>¡Que no se caiga!</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- INICIO -->
  <section id="home" class="screen active">
    <h1>¡Que no se caiga!</h1>
    <p class="subtitle">El ahorcado para aprender letras</p>
    <div id="home-figure" class="home-figure"></div>

    <p class="label">¿Quién está en el trampolín?</p>
    <div class="gender">
      <button class="chip" data-gender="chico">👦 Chico</button>
      <button class="chip" data-gender="chica">👧 Chica</button>
    </div>

    <button id="btn-mode-pick" class="big-btn primary">🖼️ Yo elijo la imagen</button>
    <button id="btn-mode-guess" class="big-btn secondary">🙈 Yo adivino</button>
  </section>

  <!-- ELEGIR IMAGEN -->
  <section id="pick" class="screen">
    <header class="bar">
      <button class="icon-btn" data-go="home" aria-label="Inicio">🏠</button>
      <h2>Elige tu imagen secreta</h2>
      <span class="spacer"></span>
    </header>
    <p class="hint">🤫 ¡Que no la vea el otro jugador!</p>
    <div id="pick-grid" class="pick-grid"></div>
  </section>

  <!-- JUEGO -->
  <section id="game" class="screen">
    <header class="bar">
      <button class="icon-btn" data-go="home" aria-label="Inicio">🏠</button>
      <button id="btn-peek" class="peek-btn" aria-label="Ver mi imagen">👀 <span id="peek-emoji" class="peek-emoji">❔</span></button>
      <span id="lives" class="lives"></span>
    </header>
    <div id="figure" class="figure"></div>
    <div id="slots" class="slots"></div>
    <p id="game-hint" class="hint"></p>
    <div id="keyboard" class="keyboard"></div>
  </section>

  <!-- ¿ESTÁ LA LETRA? -->
  <div id="ask" class="overlay">
    <div class="card">
      <div class="ask-emoji" id="ask-emoji"></div>
      <div class="big-letter" id="ask-letter"></div>
      <p class="question" id="ask-question"></p>
      <div class="row">
        <button id="btn-yes" class="big-btn yes">✅ ¡Sí está!</button>
        <button id="btn-no" class="big-btn no">❌ No está</button>
      </div>
      <p id="ask-feedback" class="feedback"></p>
    </div>
  </div>

  <!-- ESCRIBIR LA LETRA -->
  <div id="trace" class="overlay">
    <div class="card trace-card">
      <div class="trace-head">
        <span class="model-letter" id="trace-model"></span>
        <p id="trace-msg" class="trace-msg"></p>
      </div>
      <canvas id="trace-canvas"></canvas>
      <div class="row">
        <button id="btn-trace-reset" class="small-btn">🔄 Empezar de nuevo</button>
        <button id="btn-trace-say" class="small-btn">🔊 Escuchar</button>
      </div>
    </div>
  </div>

  <!-- FIN -->
  <div id="end" class="overlay">
    <div class="card">
      <div class="end-emoji" id="end-emoji"></div>
      <h2 id="end-title"></h2>
      <p id="end-text" class="end-text"></p>
      <div class="end-word" id="end-word"></div>
      <button id="btn-again" class="big-btn primary">🔁 Jugar otra vez</button>
      <button class="big-btn secondary" data-go="home">🏠 Inicio</button>
    </div>
  </div>

  <div id="confetti" class="confetti"></div>

  <script src="js/letters.js"></script>
  <script src="js/words.js"></script>
  <script src="js/figure.js"></script>
  <script src="js/tracer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
